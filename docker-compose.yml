services:
  mock-bse-api:
    build:
      context: ./mock-bse-api
    environment:
      BSE_API_PORT: 3001
      BSE_PAGE_DELAY_MS: ${BSE_PAGE_DELAY_MS:-500}
      BSE_FAILURE_RATE: ${BSE_FAILURE_RATE:-0.20}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  portal:
    build:
      context: ./portal
    environment:
      PORTAL_PORT: 3000
      BSE_API_URL: http://mock-bse-api:3001
      BSE_REQUEST_TIMEOUT_MS: ${BSE_REQUEST_TIMEOUT_MS:-25000}
      BSE_MAX_RETRIES: ${BSE_MAX_RETRIES:-5}
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-60000}
      INCENTIVE_RATE: ${INCENTIVE_RATE:-0.10}
      DATABASE_PATH: /data/portal.db
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    volumes:
      - portal-data:/data
    depends_on:
      mock-bse-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  portal-data:
